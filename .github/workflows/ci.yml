name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate release scripts and metadata
        run: |
          for shell_script in build.sh run.sh test.sh scripts/*.sh; do
            bash -n "$shell_script"
          done
          plutil -lint Resources/Info.plist
      - name: Show Swift version
        run: swift --version
      - name: Build core package target
        run: swift build --target VideoHarborCore
      - name: Run core regression suite
        run: ./test.sh
